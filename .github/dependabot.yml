# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - '*'
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      # Bundled into dist/ — src/ imports these directly.
      actions-runtime:
        patterns:
          - '@actions/*'
      # Generates dist/ — esbuild codegen differs between versions, so a bump
      # here rewrites the bundle without any source change. Kept separate so
      # those PRs are obvious.
      bundler:
        patterns:
          - 'esbuild'
      # Everything else: types, linters, formatters. Never reaches dist/.
      node:
        patterns:
          - '*'
        exclude-patterns:
          - '@actions/*'
          - 'esbuild'
    ignore:
      # TypeScript 7 is the Go rewrite. Its JS API drops internals that
      # @typescript-eslint still uses, and no released version supports it
      # (peer range is >=4.8.4 <6.1.0). Unpin once it does.
      - dependency-name: typescript
        versions:
          - '>=7'
